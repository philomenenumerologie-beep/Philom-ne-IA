<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1a2e20"/>
<title id="page-title">Chargement...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --couleur-fond:#f2ead8; --couleur-texte:#1a1a1a; --couleur-fonce:#1a2e20;
  --couleur-accent:#2d5a3d; --couleur-clair:#e8dfcf; --couleur-alerte:#c9a84c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--couleur-fond);font-family:Jost,sans-serif;color:var(--couleur-texte)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

#splash{position:fixed;inset:0;z-index:500;background:var(--couleur-fonce);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.sp-roue{width:46px;height:46px;border-radius:50%;border:4px solid rgba(0,0,0,.1);border-top-color:var(--couleur-fonce);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
#splash.gone{opacity:0;pointer-events:none}
.sp-logo{width:110px;height:110px;border-radius:50%;background:var(--couleur-fond);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) .3s both;font-size:48px;overflow:hidden}
.sp-logo img{width:100%;height:100%;object-fit:cover}
.sp-name{font-family:'Playfair Display',serif;font-size:30px;color:var(--couleur-fond);letter-spacing:.06em;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) .5s both;text-align:center;padding:0 20px}
.sp-sub{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(242,234,216,.5);margin-top:10px;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) .7s both;text-align:center;padding:0 20px}

#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#topbar{background:var(--couleur-fonce);padding:13px 18px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(242,234,216,.08);flex-shrink:0}
.tb-av{width:44px;height:44px;border-radius:50%;background:var(--couleur-fond);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;overflow:hidden}
.tb-av img{width:100%;height:100%;object-fit:cover}
.tb-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--couleur-fond);letter-spacing:.04em}
.tb-sub{font-size:10px;color:rgba(242,234,216,.38);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.tb-dot{width:9px;height:9px;border-radius:50%;background:#6BCB77;box-shadow:0 0 8px #6BCB77;animation:pulse 2s infinite;margin-left:auto;flex-shrink:0}

#tabs{background:var(--couleur-fonce);display:flex;border-bottom:1px solid rgba(242,234,216,.1);flex-shrink:0;overflow-x:auto}
.tab{flex:1;min-width:64px;padding:10px 2px 9px;text-align:center;font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(242,234,216,.35);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .22s;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tab span{font-size:14px}
.tab.active{color:var(--couleur-fond);border-bottom-color:var(--couleur-alerte)}

.page{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.page > *{flex-shrink:0}
#pages-dynamiques{display:contents}
.page.active{display:flex}
.page::-webkit-scrollbar{width:0}

#page-chat{background:var(--couleur-fond)}
#messages{flex:1;padding:16px 14px 6px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;animation:msgIn .28s cubic-bezier(.16,1,.3,1)}
.mrow.bot{justify-content:flex-start;gap:8px}
.mrow.user{justify-content:flex-end}
.bav{width:32px;height:32px;border-radius:50%;background:var(--couleur-fonce);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:16px;overflow:hidden}
.bav img{width:100%;height:100%;object-fit:cover}
.bub{max-width:min(80%,330px);padding:11px 14px;font-size:14px;line-height:1.65;white-space:pre-wrap;border-radius:20px}
.bub.bot{background:#fff;color:#111;border-top-left-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.bub.user{background:var(--couleur-fonce);color:var(--couleur-fond);border-top-right-radius:4px}
.qbtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.qb{padding:7px 12px;border-radius:22px;border:1.5px solid var(--couleur-fonce);background:transparent;color:var(--couleur-fonce);font-size:12px;font-weight:500;font-family:Jost,sans-serif;cursor:pointer}
.tybub{background:#fff;border-radius:20px;border-top-left-radius:4px;padding:12px 15px;display:flex;gap:5px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.tybub span{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite}
.tybub span:nth-child(2){animation-delay:.2s}
.tybub span:nth-child(3){animation-delay:.4s}
#composer{padding:10px 14px 22px;background:var(--couleur-fond);border-top:1px solid rgba(0,0,0,.08);flex-shrink:0}
.crow{display:flex;gap:10px;align-items:center}
#inp{flex:1;padding:12px 16px;border-radius:26px;border:1.5px solid rgba(0,0,0,.14);background:#fff;font-size:15px;font-family:Jost,sans-serif;outline:none;color:#111}
#inp:focus{border-color:var(--couleur-fonce)}
#snd{width:46px;height:46px;border-radius:50%;border:none;background:var(--couleur-fonce);color:var(--couleur-fond);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.wa-bubble{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;border-radius:12px;padding:11px;font-weight:700;font-size:13px;font-family:Jost,sans-serif;text-decoration:none;margin-top:10px;border:none;width:100%;cursor:pointer}

.pg{padding:20px 15px 32px}
.pg-h{font-family:'Playfair Display',serif;font-size:26px;font-weight:700}
.pg-h em{font-style:italic;color:#999;font-size:.68em;display:block;font-family:Jost,sans-serif;text-transform:none;letter-spacing:0;margin-top:2px}
.pg-sub{font-size:13px;color:#666;margin:6px 0 16px}

.tcard{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tcard-top{display:flex;justify-content:space-between;align-items:flex-start}
.tcard-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:600}
.tcard-sub{font-size:11px;color:#888;margin-top:3px}
.tcard-badge{background:var(--couleur-fonce);color:var(--couleur-fond);font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-left:8px}
.twa{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;border-radius:14px;padding:15px;text-decoration:none;font-weight:700;font-size:14px;font-family:Jost,sans-serif;margin-top:10px}

.lbl{font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--couleur-accent);margin:14px 0 7px}
.df-select,.df-textarea,.df-input{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid rgba(0,0,0,.14);background:#fff;font-size:14px;font-family:Jost,sans-serif;color:#1a1a1a;outline:none;-webkit-appearance:none}
.df-textarea{resize:none;height:80px}
.df-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;border-radius:15px;padding:16px;font-weight:700;font-size:15px;font-family:Jost,sans-serif;border:none;width:100%;cursor:pointer;margin-top:16px}
.devis-card{background:#f9f6ef;border:1.5px solid rgba(0,0,0,.12);border-radius:14px;padding:14px;width:100%;max-width:min(90%,340px)}
.devis-approx-tag{display:inline-block;background:var(--couleur-alerte);color:#2b2410;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:10px}
.devis-card-title{font-size:11px;font-weight:700;color:var(--couleur-fonce);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.1)}
.devis-section{font-size:10px;font-weight:700;color:#7a8c6a;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 6px}
.devis-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#1a1a1a;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.devis-line:last-child{border-bottom:none}
.devis-line-label{flex:1;color:#444}
.devis-line-price{font-weight:700;color:var(--couleur-fonce);margin-left:10px;white-space:nowrap}
.devis-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:2px solid rgba(0,0,0,.15)}
.devis-total-label{font-weight:700;font-size:14px}
.devis-total-price{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--couleur-accent)}
.devis-note{font-size:11px;font-style:italic;color:#888;margin-top:10px}

.cat-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:6;background:var(--couleur-fond);margin:0 -15px 6px;padding:10px 15px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;min-height:38px;padding:0 16px!important;font-size:14px!important}
.cat-section{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin:18px 0 4px}
.menu-liste{display:flex;flex-direction:column}
.menu-ligne{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.08);cursor:pointer}
.menu-texte{flex:1;min-width:0}
.menu-nom{font-size:16px;font-weight:600;line-height:1.3}
.menu-desc{font-size:13.5px;color:#777;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu-prix{font-size:15px;font-weight:600;margin-top:6px}
.menu-photo{position:relative;width:104px;height:104px;flex-shrink:0;border-radius:14px;background:var(--couleur-clair);overflow:visible;display:flex;align-items:center;justify-content:center;font-size:34px}
.menu-photo img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.menu-plus{position:absolute;right:-6px;bottom:-6px;min-width:38px;height:38px;border-radius:999px;border:none;background:#fff;color:var(--couleur-fonce);font-size:22px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 4px}
.menu-plus.qte{background:var(--couleur-fonce);color:var(--couleur-fond);font-size:15px;gap:2px}
.menu-plus.qte button{width:30px;height:30px;border:none;background:none;color:inherit;font-size:18px;font-weight:700;cursor:pointer}
.menu-sans-photo .menu-photo{width:auto;height:auto;background:none}
.menu-sans-photo .menu-plus{position:static}
.cat-tab{padding:6px 14px;border-radius:20px;border:1.5px solid rgba(0,0,0,.12);background:#fff;font-size:12px;font-family:Jost,sans-serif;font-weight:500;cursor:pointer;color:#777}
.cat-tab.active{background:var(--couleur-fonce);color:var(--couleur-fond);border-color:var(--couleur-fonce)}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.item-thumb{width:100%;aspect-ratio:1;background:var(--couleur-clair);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;cursor:pointer}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-info{padding:10px 12px 12px}
.item-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;cursor:pointer}
.item-price{font-size:12px;color:var(--couleur-accent);margin-top:2px;font-weight:600}
.item-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.item-tag{font-size:9px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--couleur-clair);color:var(--couleur-fonce)}
.qty-stepper{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:var(--couleur-clair);border-radius:10px;padding:4px}
.qty-btn{width:26px;height:26px;border-radius:8px;border:none;background:#fff;color:var(--couleur-fonce);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-val{font-size:13px;font-weight:600;min-width:18px;text-align:center}

.panier-bar{position:sticky;bottom:12px;background:var(--couleur-fonce);color:var(--couleur-fond);padding:0 18px;min-height:56px;border-radius:999px;display:none;justify-content:space-between;align-items:center;margin-top:18px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15.5px;font-weight:600;z-index:7}
.panier-bar .nb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:999px;background:var(--couleur-fond);color:var(--couleur-fonce);font-size:13px;font-weight:700;margin-right:10px;padding:0 6px}
.panier-bar.show{display:flex}

#panier-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#panier-overlay.open{display:flex}
#panier-box{background:var(--couleur-fond);border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
.panier-titre{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:14px}
.panier-modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.panier-mode-btn{padding:9px 14px;border-radius:12px;border:1.5px solid rgba(0,0,0,.15);background:#fff;font-size:13px;cursor:pointer;color:#555}
.panier-mode-btn.active{background:var(--couleur-fonce);color:var(--couleur-fond);border-color:var(--couleur-fonce)}
.panier-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.panier-line-nom{font-size:14px;font-weight:600}
.panier-line-prix{font-size:13px;color:#888;margin-top:2px}
.panier-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:2px solid rgba(0,0,0,.15);font-weight:700;font-size:17px}
.panier-vide{text-align:center;color:#999;padding:20px;font-size:13px}
.pg-empty{grid-column:1/-1;text-align:center;padding:30px 10px;color:#999;font-size:13px}

.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal-item{border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.gal-avap{display:grid;grid-template-columns:1fr 1fr}
.gal-avap img{width:100%;aspect-ratio:1;object-fit:cover}
.gal-title{padding:8px 10px;font-size:12px;font-weight:600;background:#fff}

.day-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.day-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1.5px solid rgba(0,0,0,.12);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer;color:#777;text-transform:uppercase}
.day-tab.active{background:var(--couleur-fonce);color:var(--couleur-fond);border-color:var(--couleur-fonce)}
.class-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:4px solid var(--couleur-alerte);cursor:pointer}
.class-time{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#999;text-transform:uppercase;margin-bottom:5px}
.class-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;margin-bottom:3px}
.class-meta{font-size:12.5px;color:#777}

.rz-row{display:flex;gap:10px}
.rz-row > div{flex:1}

#overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#overlay.open{display:flex}
#mbox{background:var(--couleur-fond);border-radius:24px 24px 0 0;padding:28px 20px 44px;width:100%;max-width:480px;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
.mbox-img{width:100%;max-height:60vw;border-radius:16px;object-fit:cover;margin:0 auto 16px;display:block;background:var(--couleur-clair)}
.mbox-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.mbox-desc{font-size:13px;color:#777;text-align:center;line-height:1.6;margin-bottom:8px}
.mbox-price{text-align:center;font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--couleur-accent);margin-bottom:18px}
.mbox-cancel{display:block;text-align:center;padding:12px;font-size:14px;color:#888;cursor:pointer;font-family:Jost,sans-serif;border:none;background:none;width:100%}

.moteur-badge{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:8px;color:rgba(0,0,0,.2);z-index:600;pointer-events:none}

#paiement-banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top, 0px));z-index:700;background:#fff;color:#111;border-radius:16px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;max-width:456px;margin:0 auto;font-size:14px;line-height:1.5}
#paiement-banner.show{display:block;animation:fadeUp .4s cubic-bezier(.16,1,.3,1)}
#paiement-banner b{font-size:16px}
#paiement-banner button{margin-top:10px;width:100%;padding:10px;border-radius:10px;border:none;background:var(--couleur-fonce);color:var(--couleur-fond);font-weight:600;font-family:Jost,sans-serif;cursor:pointer}
#demo-watermark{position:fixed;inset:0;z-index:550;pointer-events:none;overflow:hidden;display:none}
#demo-watermark.show{display:block}
.demo-stripe{position:absolute;left:-20%;width:140%;background:rgba(200,60,60,.16);color:rgba(160,30,30,.55);font-weight:800;font-size:15px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:6px 0;transform:rotate(-24deg);white-space:nowrap;font-family:Jost,sans-serif}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-logo" id="sp-logo"><div class="sp-roue" aria-label="Chargement"></div></div>
  <div class="sp-name" id="sp-name"></div>
  <div class="sp-sub" id="sp-sub"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-av" id="tb-av">🔧</div>
    <div>
      <div class="tb-name" id="tb-name">...</div>
      <div class="tb-sub" id="tb-sub">Assistant IA · 24h/24</div>
    </div>
    <div class="tb-dot"></div>
  </div>

  <div id="tabs"></div>

  <div id="page-chat" class="page active">
    <div id="messages"></div>
    <div style="height:12px;flex-shrink:0"></div>
    <div id="composer">
      <div class="crow">
        <input id="inp" type="text" placeholder="Posez votre question..."/>
        <button id="snd" onclick="sendMsg()" aria-label="Envoyer">&#10148;</button>
      </div>
    </div>
  </div>

  <div id="pages-dynamiques"></div>
</div>

<div id="overlay" onclick="fermerModal()">
  <div id="mbox" onclick="event.stopPropagation()">
    <div id="mbox-img-wrap"></div>
    <div class="mbox-name" id="mbox-name"></div>
    <div class="mbox-desc" id="mbox-desc"></div>
    <div class="mbox-price" id="mbox-price"></div>
    <button class="wa-bubble" id="mbox-add" onclick="ajouterDepuisModal()">➕ Ajouter au panier</button>
    <button class="mbox-cancel" onclick="fermerModal()">Fermer</button>
  </div>
</div>

<div id="panier-overlay" onclick="fermerPanier()">
  <div id="panier-box" onclick="event.stopPropagation()">
    <div class="panier-titre">🛒 Mon panier</div>
    <div class="panier-modes" id="panier-modes"></div>
    <div id="panier-lignes"></div>
    <div class="panier-total"><div>Total</div><div id="panier-total-val">0€</div></div>
    <button class="wa-bubble" id="btn-payer-carte" style="margin-top:16px;display:none;background:var(--couleur-fonce);color:var(--couleur-fond)" onclick="payerParCarte()">💳 Payer par carte</button>
    <button class="wa-bubble" id="btn-commande-wa" style="margin-top:16px" onclick="envoyerCommandePanier()">📱 Envoyer ma commande sur WhatsApp</button>
    <button class="mbox-cancel" onclick="fermerPanier()">Continuer mes achats</button>
  </div>
</div>

<div id="paiement-banner" role="status"></div>

<div class="moteur-badge">Moteur générique multi-modules · Philomène IA</div>

<div id="demo-watermark">
  <div class="demo-stripe" style="top:12%;">DÉMO — EN ATTENTE DE VALIDATION</div>
  <div class="demo-stripe" style="top:45%;">DÉMO — EN ATTENTE DE VALIDATION</div>
  <div class="demo-stripe" style="top:78%;">DÉMO — EN ATTENTE DE VALIDATION</div>
</div>

<script>
var API = "https://philo-backend-by2c.onrender.com";
var CONFIG = null;
var busy = false;
var catalogueFiltreActif = "tous";

/* ===================== SÉCURITÉ ===================== */
/* Tout le contenu (fiche client ET réponses de l'IA) est échappé avant affichage */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* N'accepte que les images stockées en base64 ou servies en https */
function imageSure(src){
  src = String(src || "");
  return (/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+\/=]+$/i.test(src) || /^https:\/\//i.test(src)) ? src : "";
}
function numeroWa(){
  return String((CONFIG && CONFIG.telephoneWhatsApp) || "").replace(/[^0-9]/g, "");
}
function lienWa(msg){
  return "https://wa.me/" + numeroWa() + "?text=" + encodeURIComponent(msg);
}
function el(tag, classe, texte){
  var e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texte != null) e.textContent = texte;
  return e;
}

function getSlugFromUrl() {
  if (window.PHILO_CLIENT) return String(window.PHILO_CLIENT).replace(/[^a-zA-Z0-9_-]/g, "");
  var params = new URLSearchParams(window.location.search);
  return (params.get("client") || "demo").replace(/[^a-zA-Z0-9_-]/g, "");
}

function remplirIcone(conteneur, cfg) {
  conteneur.innerHTML = "";
  var src = imageSure(cfg.logoImage);
  if (src) { var img = document.createElement("img"); img.src = src; img.alt = "logo"; conteneur.appendChild(img); }
  else conteneur.textContent = cfg.icone || "🔧";
}

/* ===================== CHARGEMENT CONFIG ===================== */
/* L'appli garde une copie sur le téléphone : au 2e passage, elle s'affiche tout de suite,
   puis se met à jour en arrière-plan. */
var CLE_CACHE = "philoAppli_" + getSlugFromUrl();
var A_INTERAGI = /[?&]paiement=/.test(window.location.search); // retour de paiement : ne jamais recharger
["click", "keydown", "touchstart"].forEach(function(ev){ document.addEventListener(ev, function(){ A_INTERAGI = true; }, { once: true, passive: true }); });

function chargerConfig() {
  var copie = null;
  try { copie = JSON.parse(localStorage.getItem(CLE_CACHE) || "null"); } catch(e){}
  if (copie && copie.nom) appliquerConfig(copie, true);

  fetch(API + "/memory/config_" + getSlugFromUrl() + "?leger=1")
    .then(function(r){ return r.json(); })
    .then(function(d){
      var cfg = (d && d.value) ? d.value : null;
      if (!cfg) { if (!copie) appliquerConfig(CONFIG_PAR_DEFAUT); return; }
      var neuf = JSON.stringify(cfg);
      try { localStorage.setItem(CLE_CACHE, neuf); } catch(e){}
      if (!copie) { appliquerConfig(cfg); return; }
      // La copie était différente (prix, menu, photos…) : on recharge si le client n'a encore rien touché
      if (neuf !== JSON.stringify(copie) && !A_INTERAGI) window.location.reload();
    })
    .catch(function(){ if (!copie) appliquerConfig(CONFIG_PAR_DEFAUT); });
}

function definirIconePWA(cfg) {
  var src = imageSure(cfg.logoImage);
  if (src) { injecterIconePWA(src); return; }
  var canvas = document.createElement("canvas");
  canvas.width = 180; canvas.height = 180;
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = cfg.couleurs.fonce || "#1a2e20";
  ctx.fillRect(0, 0, 180, 180);
  ctx.font = "96px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(cfg.icone || "🔧", 90, 100);
  injecterIconePWA(canvas.toDataURL("image/png"));
}

function injecterIconePWA(dataUrl) {
  document.querySelectorAll('link[rel="apple-touch-icon"], link[rel="icon"]').forEach(function(l){ l.remove(); });
  ["apple-touch-icon", "icon"].forEach(function(rel){
    var link = document.createElement("link");
    link.rel = rel;
    link.href = dataUrl;
    document.head.appendChild(link);
  });
  var metaTitre = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (!metaTitre) {
    metaTitre = document.createElement("meta");
    metaTitre.name = "apple-mobile-web-app-title";
    document.head.appendChild(metaTitre);
  }
  metaTitre.content = CONFIG.nom;
}

function couleurSure(c, secours){
  return /^#[0-9a-f]{3,8}$/i.test(String(c || "")) ? c : secours;
}

function appliquerConfig(cfg, depuisCopie) {
  cfg.nom = cfg.nom || "Mon appli";
  cfg.couleurs = cfg.couleurs || {};
  CONFIG = cfg;
  document.title = cfg.nom;

  var root = document.documentElement.style;
  root.setProperty("--couleur-fond", couleurSure(cfg.couleurs.fond, "#f2ead8"));
  root.setProperty("--couleur-texte", couleurSure(cfg.couleurs.texte, "#1a1a1a"));
  root.setProperty("--couleur-fonce", couleurSure(cfg.couleurs.fonce, "#1a2e20"));
  root.setProperty("--couleur-accent", couleurSure(cfg.couleurs.accent, "#2d5a3d"));
  root.setProperty("--couleur-clair", couleurSure(cfg.couleurs.clair, couleurSure(cfg.couleurs.fond, "#e8dfcf")));
  root.setProperty("--couleur-alerte", couleurSure(cfg.couleurs.alerte, couleurSure(cfg.couleurs.accent, "#c9a84c")));

  remplirIcone(document.getElementById("sp-logo"), cfg);
  document.getElementById("sp-name").textContent = cfg.nom.toUpperCase();
  document.getElementById("sp-sub").textContent = cfg.sousTitre || "";
  remplirIcone(document.getElementById("tb-av"), cfg);
  document.getElementById("tb-name").textContent = cfg.nom;
  document.getElementById("tb-sub").textContent = cfg.chatActif !== false ? "Assistant IA · 24h/24" : (cfg.sousTitre || "");
  definirIconePWA(cfg);

  construireTabs(cfg);
  construirePagesDynamiques(cfg);

  if (cfg.valide === false) {
    document.getElementById("demo-watermark").classList.add("show");
  } else if (cfg.valide === true && cfg.dateExpiration && new Date() > new Date(cfg.dateExpiration)) {
    // Abonnement mensuel : on demande d'abord à Stripe si le mois suivant est payé
    fetch(API + "/abonnement/rafraichir/appli/" + getSlugFromUrl(), { method: "POST" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.dateExpiration && new Date(d.dateExpiration) > new Date()) return;
        document.getElementById("demo-watermark").classList.add("show");
        document.querySelectorAll(".demo-stripe").forEach(function(s){ s.textContent = "ABONNEMENT EXPIRÉ — CONTACTEZ PHILOMÈNE IA"; });
      })
      .catch(function(){
        document.getElementById("demo-watermark").classList.add("show");
      });
  }

  verifierPaiementCarte(cfg);
  gererRetourPaiement();

  setTimeout(function(){
    document.getElementById("splash").classList.add("gone");
    setTimeout(function(){
      document.getElementById("splash").style.display = "none";
      if (cfg.chatActif !== false) addBot(cfg.messageAccueil, true);
    }, depuisCopie ? 150 : 400);
  }, depuisCopie ? 0 : 450);
}

var MODULE_LABELS = {
  tarifs: { icone: "💰", nom: "Tarifs" },
  devis: { icone: "📋", nom: "Devis" },
  catalogue: { icone: "🛍️", nom: "Catalogue" },
  galerie: { icone: "🖼️", nom: "Galerie" },
  planning: { icone: "🗓️", nom: "Planning" },
  reservation: { icone: "📅", nom: "Réserver" }
};

function modulesValides(cfg){
  return (cfg.modulesActifs || []).filter(function(m){ return MODULE_LABELS[m]; });
}

function creerTab(icone, nom, actif, onClic){
  var b = el("button", "tab" + (actif ? " active" : ""));
  b.appendChild(el("span", null, icone));
  b.appendChild(document.createTextNode(nom));
  b.onclick = function(){ onClic(b); };
  return b;
}

function construireTabs(cfg) {
  var tabs = document.getElementById("tabs");
  var chatActif = cfg.chatActif !== false;
  tabs.innerHTML = "";
  if (chatActif) tabs.appendChild(creerTab("💬", "Assistant", true, function(b){ showTab(b, "chat"); }));
  document.getElementById("page-chat").style.display = chatActif ? "" : "none";
  modulesValides(cfg).forEach(function(mod, i){
    var info = MODULE_LABELS[mod];
    var nom = (mod === "catalogue" && cfg.catalogueOnglet) ? String(cfg.catalogueOnglet).slice(0, 14) : info.nom;
    tabs.appendChild(creerTab(info.icone, nom, !chatActif && i === 0, function(b){ showTab(b, mod); }));
  });
}

function showTab(btn, n) {
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-" + n).classList.add("active");
  btn.classList.add("active");
}

/* ===================== CONSTRUCTION DES PAGES ===================== */
function construirePagesDynamiques(cfg) {
  var container = document.getElementById("pages-dynamiques");
  container.innerHTML = "";
  var chatActif = cfg.chatActif !== false;
  modulesValides(cfg).forEach(function(mod, i){
    var div = el("div", "page" + (!chatActif && i === 0 ? " active" : ""));
    div.id = "page-" + mod;
    container.appendChild(div);
    if (mod === "tarifs") construireTarifs(div, cfg);
    if (mod === "devis") construireDevis(div, cfg);
    if (mod === "catalogue") construireCatalogue(div, cfg);
    if (mod === "galerie") construireGalerie(div, cfg);
    if (mod === "planning") construirePlanning(div, cfg);
    if (mod === "reservation") construireReservation(div, cfg);
  });
}

function enTete(titre, sousTitre){
  return '<div class="pg-h">' + esc(titre) + '<em>' + esc(sousTitre) + '</em></div>';
}

/* ---------- TARIFS ---------- */
function construireTarifs(div, cfg) {
  var html = '<div class="pg">' + enTete("Tarifs", cfg.tarifsSousTitre || "Indicatifs");
  (cfg.tarifs || []).forEach(function(t){
    html += '<div class="tcard"><div class="tcard-top"><div><div class="tcard-name">' + esc(t.nom) + '</div><div class="tcard-sub">' + esc(t.description) + '</div></div><div class="tcard-badge">' + esc(t.prix) + '</div></div></div>';
  });
  html += '<a class="twa" href="' + esc(lienWa("Bonjour " + cfg.nom + " !")) + '" target="_blank" rel="noopener">📱 Demander un devis</a></div>';
  div.innerHTML = html;
}

/* ---------- DEVIS ---------- */
function construireDevis(div, cfg) {
  var options = (cfg.devisTypes && cfg.devisTypes.length ? cfg.devisTypes : ["Autre"]).map(function(t){ return '<option>' + esc(t) + '</option>'; }).join('');
  var labelSurface = cfg.devisSurfaceLabel || "Détails (taille, surface, quantité...)";
  var placeholderSurface = cfg.devisSurfacePlaceholder || "Ex: 25m², 15cm, 3 pièces...";
  div.innerHTML =
    '<div class="pg">' + enTete("Devis gratuit", "Décrivez votre projet") +
    '<div class="lbl">Type de prestation</div>' +
    '<select class="df-select" id="dv-type"><option value="">Sélectionnez...</option>' + options + '</select>' +
    '<div class="lbl">Description</div>' +
    '<textarea class="df-textarea" id="dv-desc" placeholder="Décrivez votre besoin..."></textarea>' +
    '<div class="lbl">' + esc(labelSurface) + '</div>' +
    '<input class="df-input" id="dv-surface" placeholder="' + esc(placeholderSurface) + '"/>' +
    '<button class="df-btn" onclick="genererDevisForm()">✨ Générer mon devis</button>' +
    '<div id="devis-resultat-inline"></div>' +
    '</div>';
}

var DEVIS_PROMPT_SECOURS = "Tu es un professionnel qui établit un devis approximatif à partir d'une demande décrite par un client. RÈGLE PRIORITAIRE : si un prix est explicitement mentionné dans la description, utilise-le exactement tel quel plutôt qu'un prix de marché. Réponds UNIQUEMENT en JSON valide, sans texte autour, avec ce format exact : {\"titre\":\"DEVIS APPROXIMATIF — ...\",\"materiaux\":[{\"label\":\"...\",\"detail\":\"...\",\"prix\":\"...\"}],\"maindoeuvre\":[{\"label\":\"...\",\"detail\":\"...\",\"prix\":\"...\"}],\"total\":\"...\",\"duree\":\"...\"}. Si la prestation n'a pas de matériaux (ex: un service), laisse materiaux à []. Montants réalistes, arrondis.";

function genererDevisForm() {
  var type = document.getElementById("dv-type").value;
  var desc = document.getElementById("dv-desc").value.trim();
  var surface = document.getElementById("dv-surface").value.trim();
  if (!type) { alert("Merci de sélectionner un type de prestation."); return; }

  var resume = "Devis pour : " + type + (desc ? " — " + desc : "") + (surface ? " — " + surface : "");
  var chatActif = CONFIG.chatActif !== false;
  var zone = document.getElementById("devis-resultat-inline");

  if (chatActif) {
    document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
    document.getElementById("page-chat").classList.add("active");
    document.querySelectorAll(".tab")[0].classList.add("active");
    addUser(resume);
    setTyping(true);
  } else {
    zone.innerHTML = '<div class="tybub" style="margin-top:16px"><span></span><span></span><span></span></div>';
  }

  var messageIA = "Génère un devis pour cette demande :\nType : " + type + "\n" + (desc ? "Description : " + desc + "\n" : "") + (surface ? "Surface/quantité : " + surface : "");
  var promptDevis = CONFIG.devisPrompt || DEVIS_PROMPT_SECOURS;
  if (CONFIG.tauxHoraire) {
    promptDevis += " Ton taux horaire de main d'oeuvre est de " + CONFIG.tauxHoraire + "€/heure : base-toi précisément dessus pour calculer chaque ligne de main d'oeuvre selon le temps estimé, au lieu d'un prix de marché générique.";
  }

  function erreur(msg){
    if (chatActif) { setTyping(false); addBot(msg); }
    else { zone.innerHTML = ""; zone.appendChild(el("div", "pg-empty", msg)); }
  }

  fetch(API + "/vitrine", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: messageIA, userId: getSlugFromUrl() + "_devis_" + Date.now(), systemPrompt: promptDevis })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    var data;
    try {
      var raw = (d && d.answer) ? d.answer : "{}";
      data = JSON.parse(raw.replace(/```json/g,"").replace(/```/g,"").trim());
    } catch(e) {
      erreur("Je n'ai pas réussi à générer le devis, réessayez avec une description plus précise.");
      return;
    }
    if (chatActif) { setTyping(false); renderDevisCard(data); }
    else { zone.innerHTML = ""; renderDevisCardInline(data, zone); }
  }).catch(function(){ erreur("Erreur de connexion, réessayez."); });
}

function ligneDevis(l){
  l = l || {};
  return '<div class="devis-line"><div class="devis-line-label">' + esc(nettoyerMarkdown(l.label)) + (l.detail ? " — " + esc(nettoyerMarkdown(l.detail)) : "") + '</div><div class="devis-line-price">' + esc(l.prix) + '</div></div>';
}

function construireHtmlDevisCard(data) {
  var html = '<div class="devis-approx-tag">⚠️ Devis approximatif — à confirmer</div>';
  var icone = imageSure(CONFIG.logoImage) ? '' : (CONFIG.icone || '') + ' ';
  html += '<div class="devis-card-title">' + esc(icone) + esc(nettoyerMarkdown(data.titre || "DEVIS ESTIMATIF")) + '</div>';
  if (Array.isArray(data.materiaux) && data.materiaux.length) {
    html += '<div class="devis-section">Matériaux</div>' + data.materiaux.map(ligneDevis).join("");
  }
  if (Array.isArray(data.maindoeuvre) && data.maindoeuvre.length) {
    html += '<div class="devis-section">Main d\'œuvre</div>' + data.maindoeuvre.map(ligneDevis).join("");
  }
  if (Array.isArray(data.lignes) && data.lignes.length) {
    html += data.lignes.map(ligneDevis).join("");
  }
  html += '<div class="devis-total"><div class="devis-total-label">' + (data.duree ? "Total estimé (" + esc(nettoyerMarkdown(data.duree)) + ")" : "Total estimé") + '</div><div class="devis-total-price">' + esc(data.total || "Sur devis") + '</div></div>';
  html += '<div class="devis-note">Devis estimatif — à confirmer.</div>';
  return html;
}

function creerBoutonWaDevis(data) {
  var waBtn = el("button", "wa-bubble", "✅ Confirmer sur WhatsApp");
  var waMsg = "Bonjour " + CONFIG.nom + " ! J'ai reçu ce devis estimatif : " + (data.titre || "") + ", total " + (data.total || "") + ". Je voudrais confirmer.";
  waBtn.onclick = function(){ window.open(lienWa(waMsg), "_blank"); };
  return waBtn;
}

function renderDevisCard(data) {
  var row = el("div", "mrow bot");
  var card = el("div", "devis-card");
  card.innerHTML = construireHtmlDevisCard(data);
  card.appendChild(creerBoutonWaDevis(data));
  row.appendChild(mkAv());
  row.appendChild(card);
  document.getElementById("messages").appendChild(row);
  scrollChat();
}

function renderDevisCardInline(data, container) {
  var card = el("div", "devis-card");
  card.style.marginTop = "16px";
  card.innerHTML = construireHtmlDevisCard(data);
  card.appendChild(creerBoutonWaDevis(data));
  container.appendChild(card);
}

/* ---------- CATALOGUE + PANIER ---------- */
var PANIER = {};
var modaleItemActuel = null;
var modePanierActif = null;

function parsePrix(str) {
  if (!str) return 0;
  var m = String(str).replace(',', '.').match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}
function formatPrix(n){ return n.toFixed(2).replace(".00","") + "€"; }

function construireCatalogue(div, cfg) {
  var items = cfg.catalogue || [];
  var cats = ["tous"];
  items.forEach(function(it){ if (it.categorie && cats.indexOf(it.categorie) === -1) cats.push(it.categorie); });

  var pg = el("div", "pg");
  pg.innerHTML = enTete(cfg.catalogueTitre || "Notre sélection", cfg.catalogueSousTitre || "");

  if (cats.length > 1) {
    var barre = el("div", "cat-tabs");
    barre.id = "cat-tabs";
    cats.forEach(function(c, i){
      var b = el("button", "cat-tab" + (i === 0 ? " active" : ""), c === "tous" ? "Tout" : c);
      b.onclick = function(){
        catalogueFiltreActif = c;
        barre.querySelectorAll(".cat-tab").forEach(function(x){ x.classList.remove("active"); });
        b.classList.add("active");
        renderCatalogueGrid(CONFIG.catalogue || [], c);
      };
      barre.appendChild(b);
    });
    pg.appendChild(barre);
  }

  var grid = el("div", "item-grid");
  grid.id = "catalogue-grid";
  pg.appendChild(grid);

  var bar = el("div", "panier-bar");
  bar.id = "panier-bar";
  bar.onclick = ouvrirPanier;
  var txt = el("span", null, "Voir le panier"); txt.id = "panier-bar-txt"; txt.style.display = "flex"; txt.style.alignItems = "center";
  var tot = el("span", null, "0€"); tot.id = "panier-bar-total";
  bar.appendChild(txt); bar.appendChild(tot);
  pg.appendChild(bar);

  div.appendChild(pg);
  if (cfg.catalogueModes && cfg.catalogueModes.length) modePanierActif = cfg.catalogueModes[0];
  renderCatalogueGrid(items, "tous");
}

function creerStepper(nom, qte, apres){
  var st = el("div", "qty-stepper");
  var moins = el("button", "qty-btn", "−");
  var val = el("span", "qty-val", String(qte));
  var plus = el("button", "qty-btn", "+");
  moins.onclick = function(e){ e.stopPropagation(); changerQuantite(nom, -1); val.textContent = PANIER[nom] ? PANIER[nom].qty : 0; if (apres) apres(); };
  plus.onclick = function(e){ e.stopPropagation(); changerQuantite(nom, 1); val.textContent = PANIER[nom] ? PANIER[nom].qty : 0; if (apres) apres(); };
  st.appendChild(moins); st.appendChild(val); st.appendChild(plus);
  return st;
}

function renderCatalogueGrid(items, filtre) {
  var grid = document.getElementById("catalogue-grid");
  grid.className = "menu-liste";
  var liste = filtre === "tous" ? items : items.filter(function(it){ return it.categorie === filtre; });
  grid.innerHTML = "";
  if (!liste.length) { grid.appendChild(el("div", "pg-empty", "Rien à afficher pour le moment.")); return; }
  // En « Tout », on regroupe par catégorie, comme sur les applis de livraison
  var groupes = [];
  liste.forEach(function(it){
    var c = it.categorie || "";
    var g = groupes.filter(function(x){ return x.cat === c; })[0];
    if (!g) { g = { cat: c, items: [] }; groupes.push(g); }
    g.items.push(it);
  });
  groupes.forEach(function(g){
    if (filtre === "tous" && g.cat && groupes.length > 1) grid.appendChild(el("div", "cat-section", g.cat));
    g.items.forEach(function(it){ grid.appendChild(ligneMenu(it)); });
  });
}

function ligneMenu(it) {
  var src = imageSure(it.image);
  var ligne = el("div", "menu-ligne" + (src ? "" : " menu-sans-photo"));
  ligne.onclick = function(){ ouvrirItem(it); };
  var txt = el("div", "menu-texte");
  txt.appendChild(el("div", "menu-nom", it.nom));
  if (it.description) txt.appendChild(el("div", "menu-desc", it.description));
  txt.appendChild(el("div", "menu-prix", it.prix));
  if (it.tags) {
    var tags = el("div", "item-tags");
    String(it.tags).split(",").map(function(t){ return t.trim(); }).filter(Boolean).forEach(function(t){ tags.appendChild(el("span", "item-tag", t)); });
    txt.appendChild(tags);
  }
  var photo = el("div", "menu-photo");
  if (src) { var img = document.createElement("img"); img.src = src; img.alt = it.nom || ""; img.loading = "lazy"; photo.appendChild(img); }
  photo.appendChild(boutonQuantite(it));
  ligne.appendChild(txt); ligne.appendChild(photo);
  return ligne;
}

/* Bouton « + » qui devient « − 2 + » une fois ajouté */
function boutonQuantite(it) {
  var qte = PANIER[it.nom] ? PANIER[it.nom].qty : 0;
  var zone = el("div", "menu-plus" + (qte ? " qte" : ""));
  var redessiner = function(){ var n = boutonQuantite(it); zone.replaceWith(n); };
  if (!qte) {
    zone.textContent = "+";
    zone.setAttribute("role", "button");
    zone.setAttribute("aria-label", "Ajouter " + (it.nom || ""));
    zone.onclick = function(e){ e.stopPropagation(); changerQuantite(it.nom, 1); redessiner(); };
  } else {
    var m = el("button", null, "−"); m.setAttribute("aria-label", "Retirer un");
    var v = el("span", null, String(qte));
    var p = el("button", null, "+"); p.setAttribute("aria-label", "Ajouter un");
    m.onclick = function(e){ e.stopPropagation(); changerQuantite(it.nom, -1); redessiner(); };
    p.onclick = function(e){ e.stopPropagation(); changerQuantite(it.nom, 1); redessiner(); };
    zone.onclick = function(e){ e.stopPropagation(); };
    zone.appendChild(m); zone.appendChild(v); zone.appendChild(p);
  }
  return zone;
}

function trouverItem(nom) {
  return (CONFIG.catalogue || []).filter(function(i){ return i.nom === nom; })[0];
}

function changerQuantite(nom, delta) {
  var item = trouverItem(nom);
  if (!item) return;
  if (!PANIER[nom]) PANIER[nom] = { item: item, qty: 0 };
  PANIER[nom].qty = Math.max(0, PANIER[nom].qty + delta);
  if (PANIER[nom].qty === 0) delete PANIER[nom];
  mettreAJourBarrePanier();
}

function mettreAJourBarrePanier() {
  var bar = document.getElementById("panier-bar");
  if (!bar) return;
  var count = 0, total = 0;
  Object.keys(PANIER).forEach(function(k){ count += PANIER[k].qty; total += PANIER[k].qty * parsePrix(PANIER[k].item.prix); });
  if (count === 0) { bar.classList.remove("show"); return; }
  bar.classList.add("show");
  var t = document.getElementById("panier-bar-txt"); t.innerHTML = "";
  var nb = el("span", "nb", String(count)); t.appendChild(nb); t.appendChild(document.createTextNode("Voir le panier"));
  document.getElementById("panier-bar-total").textContent = formatPrix(total);
}

function ouvrirItem(it) {
  if (!it) return;
  modaleItemActuel = it;
  var wrap = document.getElementById("mbox-img-wrap");
  wrap.innerHTML = "";
  var src = imageSure(it.image);
  if (src) { var img = document.createElement("img"); img.className = "mbox-img"; img.src = src; img.alt = it.nom || ""; wrap.appendChild(img); }
  document.getElementById("mbox-name").textContent = it.nom || "";
  document.getElementById("mbox-desc").textContent = it.description || "";
  document.getElementById("mbox-price").textContent = it.prix || "";
  document.getElementById("overlay").classList.add("open");
}
function ajouterDepuisModal() {
  if (modaleItemActuel) {
    changerQuantite(modaleItemActuel.nom, 1);
    renderCatalogueGrid(CONFIG.catalogue || [], catalogueFiltreActif);
  }
  fermerModal();
  ouvrirPanier();
}
function fermerModal() { document.getElementById("overlay").classList.remove("open"); }

function ouvrirPanier() {
  var lignes = document.getElementById("panier-lignes");
  var modes = document.getElementById("panier-modes");
  var cfg = CONFIG;

  if (cfg.catalogueModes && cfg.catalogueModes.length) {
    modes.style.display = "flex";
    modes.innerHTML = "";
    cfg.catalogueModes.forEach(function(m){
      var b = el("button", "panier-mode-btn" + (m === modePanierActif ? " active" : ""), m);
      b.onclick = function(){ modePanierActif = m; ouvrirPanier(); };
      modes.appendChild(b);
    });
  } else {
    modes.style.display = "none";
  }

  var clefs = Object.keys(PANIER);
  lignes.innerHTML = "";
  if (!clefs.length) {
    lignes.appendChild(el("div", "panier-vide", "Votre panier est vide."));
  } else {
    clefs.forEach(function(nom){
      var p = PANIER[nom];
      var row = el("div", "panier-line");
      var gauche = el("div");
      gauche.appendChild(el("div", "panier-line-nom", p.item.nom));
      gauche.appendChild(el("div", "panier-line-prix", p.item.prix));
      var stepper = creerStepper(nom, p.qty, function(){
        ouvrirPanier();
        renderCatalogueGrid(CONFIG.catalogue || [], catalogueFiltreActif);
      });
      stepper.style.width = "auto";
      var totalLigne = el("div", null, formatPrix(p.qty * parsePrix(p.item.prix)));
      totalLigne.style.cssText = "font-weight:700;margin-left:10px";
      row.appendChild(gauche); row.appendChild(stepper); row.appendChild(totalLigne);
      lignes.appendChild(row);
    });
  }

  var total = 0;
  clefs.forEach(function(nom){ total += PANIER[nom].qty * parsePrix(PANIER[nom].item.prix); });
  document.getElementById("panier-total-val").textContent = formatPrix(total);
  document.getElementById("panier-overlay").classList.add("open");
}
function fermerPanier() { document.getElementById("panier-overlay").classList.remove("open"); }

function envoyerCommandePanier() {
  var clefs = Object.keys(PANIER);
  if (!clefs.length) { alert("Votre panier est vide."); return; }
  var total = 0;
  var msg = "Bonjour " + CONFIG.nom + " ! Je voudrais commander";
  if (modePanierActif) msg += " (" + modePanierActif + ")";
  msg += " :\n\n";
  clefs.forEach(function(nom){
    var p = PANIER[nom];
    var lt = p.qty * parsePrix(p.item.prix);
    total += lt;
    msg += "· " + p.qty + "x " + p.item.nom + " — " + formatPrix(lt) + "\n";
  });
  msg += "\nTOTAL : " + formatPrix(total);
  msg += "\nJe réglerai sur place à la récupération.";
  window.open(lienWa(msg), "_blank");
}

/* =====================================================================
   INTERRUPTEUR DU PAIEMENT EN LIGNE
   false = Stripe encore en mode test : les visiteurs voient « bientôt disponible ».
   Toi, tu peux tester : ouvre une fois la page avec ?test=1 à la fin de l'adresse
   (ou déverrouille ton Espace Philomène). Passe à true quand Stripe est en mode réel.
   ===================================================================== */
var PAIEMENT_OUVERT = false;
function paiementPermis() {
  if (PAIEMENT_OUVERT) return true;
  try {
    var p = new URLSearchParams(window.location.search);
    if (p.get("test") === "1") localStorage.setItem("philoTest", "1");
    if (p.get("test") === "0") localStorage.removeItem("philoTest");
    if (localStorage.getItem("philoTest") === "1") return true;
    if (sessionStorage.getItem("philoAdminToken")) return true;
  } catch(e){}
  return false;
}
/* ---------- PAIEMENT PAR CARTE (Stripe) ---------- */
var PAIEMENT_CARTE = false;

function verifierPaiementCarte(cfg) {
  var mods = cfg.modulesActifs || [];
  if (cfg.valide !== true || mods.indexOf("catalogue") < 0 || mods.indexOf("paiement") < 0) return;
  if (!paiementPermis()) return; // les clients commandent sur WhatsApp en attendant
  fetch(API + "/stripe/status/" + getSlugFromUrl())
    .then(function(r){ return r.json(); })
    .then(function(s){
      PAIEMENT_CARTE = !!(s && s.actif);
      document.getElementById("btn-payer-carte").style.display = PAIEMENT_CARTE ? "flex" : "none";
      if (PAIEMENT_CARTE) {
        var wa = document.getElementById("btn-commande-wa");
        wa.textContent = "📱 Ou commander sur WhatsApp (paiement sur place)";
        wa.style.marginTop = "8px";
      }
    }).catch(function(){});
}

function payerParCarte() {
  var clefs = Object.keys(PANIER);
  if (!clefs.length) { alert("Votre panier est vide."); return; }
  var btn = document.getElementById("btn-payer-carte");
  btn.disabled = true; btn.textContent = "Ouverture du paiement...";
  var items = clefs.map(function(nom){ return { nom: nom, qty: PANIER[nom].qty }; });
  fetch(API + "/stripe/checkout/" + getSlugFromUrl(), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: items, mode: modePanierActif || "" })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    if (d && d.ok && d.url) { window.location.href = d.url; return; }
    alert((d && d.error) || "Paiement indisponible, réessayez.");
    btn.disabled = false; btn.textContent = "💳 Payer par carte";
  }).catch(function(){
    alert("Connexion impossible, réessayez.");
    btn.disabled = false; btn.textContent = "💳 Payer par carte";
  });
}

function afficherBanniere(titre, texte) {
  var b = document.getElementById("paiement-banner");
  b.innerHTML = "";
  b.appendChild(el("b", null, titre));
  if (texte) b.appendChild(el("div", null, texte));
  var ok = el("button", null, "OK");
  ok.onclick = function(){ b.classList.remove("show"); };
  b.appendChild(ok);
  b.classList.add("show");
}

function gererRetourPaiement() {
  var p = new URLSearchParams(window.location.search);
  var etat = p.get("paiement");
  if (!etat) return;
  var propre = window.PHILO_CLIENT ? window.location.pathname : window.location.pathname + "?client=" + encodeURIComponent(getSlugFromUrl());
  window.history.replaceState(null, "", propre);
  if (etat === "annule") { afficherBanniere("Paiement annulé", "Aucun montant n'a été débité. Votre panier est toujours disponible."); return; }
  var session = p.get("session") || "";
  afficherBanniere("Vérification du paiement...", "");
  fetch(API + "/stripe/verif/" + getSlugFromUrl() + "/" + encodeURIComponent(session))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.paye) {
        afficherBanniere("✅ Commande n° " + d.numero + " payée", "Total : " + String(d.total).replace(".", ",") + " €. Merci ! " + (CONFIG.nom || "") + " a bien reçu votre commande. Gardez ce numéro.");
      } else {
        afficherBanniere("Paiement non confirmé", "Si vous avez été débité, contactez directement le commerçant.");
      }
    }).catch(function(){
      afficherBanniere("Vérification impossible", "Si vous avez été débité, contactez directement le commerçant.");
    });
}

/* ---------- GALERIE ---------- */
function construireGalerie(div, cfg) {
  var items = cfg.galerie || [];
  var html = '<div class="pg">' + enTete(cfg.galerieTitre || "Nos réalisations", "Avant / Après") + '<div class="gal-grid">';
  if (!items.length) html += '<div class="pg-empty">Les photos arrivent bientôt !</div>';
  items.forEach(function(c){
    var av = imageSure(c.avant), ap = imageSure(c.apres);
    html += '<div class="gal-item"><div class="gal-avap">' +
      (av ? '<img src="' + esc(av) + '" alt="Avant" loading="lazy">' : '') +
      (ap ? '<img src="' + esc(ap) + '" alt="Après" loading="lazy">' : '') +
      '</div><div class="gal-title">' + esc(c.titre) + '</div></div>';
  });
  html += '</div></div>';
  div.innerHTML = html;
}

/* ---------- PLANNING ---------- */
function construirePlanning(div, cfg) {
  var planning = cfg.planning || {};
  var jours = Object.keys(planning);
  var pg = el("div", "pg");
  pg.innerHTML = enTete("Planning", "Nos créneaux");
  var barre = el("div", "day-tabs");
  var contenu = el("div");
  contenu.id = "planning-contenu";
  jours.forEach(function(j, i){
    var b = el("button", "day-tab" + (i === 0 ? " active" : ""), j);
    b.onclick = function(){
      barre.querySelectorAll(".day-tab").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      afficherJourContenu(j);
    };
    barre.appendChild(b);
  });
  pg.appendChild(barre);
  pg.appendChild(contenu);
  div.appendChild(pg);
  if (jours.length) afficherJourContenu(jours[0]);
  else contenu.appendChild(el("div", "pg-empty", "Le planning arrive bientôt."));
}

function afficherJourContenu(jour) {
  var cours = (CONFIG.planning || {})[jour] || [];
  var zone = document.getElementById("planning-contenu");
  zone.innerHTML = "";
  if (!cours.length) { zone.appendChild(el("div", "pg-empty", "Rien de prévu ce jour-là.")); return; }
  cours.forEach(function(c){
    var card = el("div", "class-card");
    card.onclick = function(){
      window.open(lienWa("Bonjour " + CONFIG.nom + " ! Je voudrais réserver : " + c.nom + " (" + c.heure + ")."), "_blank");
    };
    card.appendChild(el("div", "class-time", c.heure));
    card.appendChild(el("div", "class-name", c.nom));
    card.appendChild(el("div", "class-meta", c.meta || ""));
    zone.appendChild(card);
  });
}

/* ---------- RÉSERVATION ---------- */
function construireReservation(div, cfg) {
  var lienExterne = String(cfg.lienReservationExterne || "");
  if (/^https:\/\//i.test(lienExterne)) {
    div.innerHTML = '<div class="pg">' + enTete("Réserver", "En ligne, en quelques clics") +
      '<a class="twa" href="' + esc(lienExterne) + '" target="_blank" rel="noopener">📅 Prendre rendez-vous</a></div>';
    return;
  }
  var options = (cfg.reservationServices || []).map(function(s){ return '<option>' + esc(s.nom + (s.prix ? ' — ' + s.prix : '')) + '</option>'; }).join('');
  div.innerHTML =
    '<div class="pg">' + enTete("Réserver", "Rapide et sans engagement") +
    '<div class="lbl">Service souhaité</div>' +
    '<select class="df-select" id="rz-service"><option value="">Choisissez...</option>' + options + '</select>' +
    '<div class="rz-row"><div><div class="lbl">Date</div><input class="df-input" id="rz-date" type="date"/></div>' +
    '<div><div class="lbl">Heure</div><input class="df-input" id="rz-heure" type="time"/></div></div>' +
    '<div class="lbl">Note (optionnel)</div>' +
    '<input class="df-input" id="rz-note" placeholder="Précisions utiles..."/>' +
    '<button class="df-btn" onclick="envoyerReservation()">📱 Envoyer la demande</button>' +
    '</div>';
}

function envoyerReservation() {
  var service = document.getElementById("rz-service").value;
  var date = document.getElementById("rz-date").value;
  var heure = document.getElementById("rz-heure").value;
  var note = document.getElementById("rz-note").value.trim();
  if (!service || !date) { alert("Merci de choisir un service et une date."); return; }
  var msg = "Bonjour " + CONFIG.nom + " ! Je voudrais réserver :\n\nService : " + service + "\nDate : " + date + (heure ? "\nHeure : " + heure : "") + (note ? "\nNote : " + note : "");
  window.open(lienWa(msg), "_blank");
}

/* ===================== CHAT ===================== */
function scrollChat() {
  setTimeout(function(){ var c = document.getElementById("page-chat"); c.scrollTop = c.scrollHeight; }, 80);
}
function mkAv() {
  var av = el("div", "bav");
  remplirIcone(av, CONFIG);
  return av;
}
function nettoyerMarkdown(txt) {
  if (!txt) return "";
  return String(txt)
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^[-*]\s+/gm, '• ');
}

function addBot(txt, withQ) {
  var row = el("div", "mrow bot");
  var bub = el("div", "bub bot", nettoyerMarkdown(txt));
  if (withQ && CONFIG.questionsRapides && CONFIG.questionsRapides.length) {
    var qw = el("div", "qbtns");
    CONFIG.questionsRapides.forEach(function(it){
      var b = el("button", "qb", it.label);
      b.onclick = function(){ send(it.message); };
      qw.appendChild(b);
    });
    bub.appendChild(qw);
  }
  row.appendChild(mkAv());
  row.appendChild(bub);
  document.getElementById("messages").appendChild(row);
  scrollChat();
}
function addUser(txt) {
  var row = el("div", "mrow user");
  row.appendChild(el("div", "bub user", txt));
  document.getElementById("messages").appendChild(row);
  scrollChat();
}
function setTyping(on) {
  var old = document.getElementById("ty-row");
  if (old) old.remove();
  if (!on) return;
  var row = el("div", "mrow bot");
  row.id = "ty-row";
  var ty = el("div", "tybub");
  ty.innerHTML = "<span></span><span></span><span></span>";
  row.appendChild(mkAv());
  row.appendChild(ty);
  document.getElementById("messages").appendChild(row);
  scrollChat();
}
function send(txt) {
  if (!txt || busy) return;
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-chat").classList.add("active");
  var premierOnglet = document.querySelectorAll(".tab")[0];
  if (premierOnglet) premierOnglet.classList.add("active");
  addUser(txt);
  busy = true;
  setTyping(true);
  fetch(API + "/vitrine", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: txt, userId: getSlugFromUrl() + "_" + Date.now(), systemPrompt: CONFIG.systemPrompt })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    setTyping(false);
    addBot((d && d.answer) ? d.answer : "Je suis là pour vous aider !");
    busy = false;
  }).catch(function(){
    setTyping(false);
    addBot("Erreur de connexion, réessayez.");
    busy = false;
  });
}
function sendMsg() {
  var inp = document.getElementById("inp");
  var txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  send(txt);
}
document.getElementById("inp").addEventListener("keydown", function(e){ if (e.key === "Enter") sendMsg(); });
