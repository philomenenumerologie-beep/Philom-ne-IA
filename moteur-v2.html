<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title id="page-title">Chargement...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --couleur-fond:#f2ead8; --couleur-texte:#1a1a1a; --couleur-fonce:#1a2e20;
  --couleur-accent:#2d5a3d; --couleur-clair:#e8dfcf; --couleur-alerte:#c9a84c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--couleur-fond);font-family:Jost,sans-serif;color:var(--couleur-texte)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

#splash{position:fixed;inset:0;z-index:500;background:var(--couleur-fonce);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s}
#splash.gone{opacity:0;pointer-events:none}
.sp-logo{width:110px;height:110px;border-radius:50%;background:var(--couleur-fond);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) .3s both;font-size:48px;overflow:hidden}
.sp-logo img{width:100%;height:100%;object-fit:cover}
.sp-name{font-family:'Playfair Display',serif;font-size:30px;color:var(--couleur-fond);letter-spacing:.06em;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) .5s both;text-align:center;padding:0 20px}
.sp-sub{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(242,234,216,.5);margin-top:10px;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) .7s both;text-align:center;padding:0 20px}

#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#topbar{background:var(--couleur-fonce);padding:13px 18px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(242,234,216,.08);flex-shrink:0}
.tb-av{width:44px;height:44px;border-radius:50%;background:var(--couleur-fond);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;overflow:hidden}
.tb-av img{width:100%;height:100%;object-fit:cover}
.tb-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--couleur-fond);letter-spacing:.04em}
.tb-sub{font-size:10px;color:rgba(242,234,216,.38);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.tb-dot{width:9px;height:9px;border-radius:50%;background:#6BCB77;box-shadow:0 0 8px #6BCB77;animation:pulse 2s infinite;margin-left:auto;flex-shrink:0}

#tabs{background:var(--couleur-fonce);display:flex;border-bottom:1px solid rgba(242,234,216,.1);flex-shrink:0;overflow-x:auto}
.tab{flex:1;min-width:64px;padding:10px 2px 9px;text-align:center;font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(242,234,216,.35);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .22s;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tab span{font-size:14px}
.tab.active{color:var(--couleur-fond);border-bottom-color:var(--couleur-alerte)}

.page{flex:1;overflow-y:auto;display:none;flex-direction:column}
.page.active{display:flex}
.page::-webkit-scrollbar{width:0}

/* CHAT */
#page-chat{background:var(--couleur-fond)}
#messages{flex:1;padding:16px 14px 6px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;animation:msgIn .28s cubic-bezier(.16,1,.3,1)}
.mrow.bot{justify-content:flex-start;gap:8px}
.mrow.user{justify-content:flex-end}
.bav{width:32px;height:32px;border-radius:50%;background:var(--couleur-fonce);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:16px;overflow:hidden}
.bav img{width:100%;height:100%;object-fit:cover}
.bub{max-width:min(80%,330px);padding:11px 14px;font-size:14px;line-height:1.65;white-space:pre-wrap;border-radius:20px}
.bub.bot{background:#fff;color:#111;border-top-left-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.bub.user{background:var(--couleur-fonce);color:var(--couleur-fond);border-top-right-radius:4px}
.qbtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.qb{padding:7px 12px;border-radius:22px;border:1.5px solid var(--couleur-fonce);background:transparent;color:var(--couleur-fonce);font-size:12px;font-weight:500;font-family:Jost,sans-serif;cursor:pointer}
.tybub{background:#fff;border-radius:20px;border-top-left-radius:4px;padding:12px 15px;display:flex;gap:5px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.tybub span{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite}
.tybub span:nth-child(2){animation-delay:.2s}
.tybub span:nth-child(3){animation-delay:.4s}
#composer{padding:10px 14px 22px;background:var(--couleur-fond);border-top:1px solid rgba(0,0,0,.08);flex-shrink:0}
.crow{display:flex;gap:10px;align-items:center}
#inp{flex:1;padding:12px 16px;border-radius:26px;border:1.5px solid rgba(0,0,0,.14);background:#fff;font-size:15px;font-family:Jost,sans-serif;outline:none;color:#111}
#inp:focus{border-color:var(--couleur-fonce)}
#snd{width:46px;height:46px;border-radius:50%;border:none;background:var(--couleur-fonce);color:var(--couleur-fond);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.wa-bubble{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;border-radius:12px;padding:11px;font-weight:700;font-size:13px;font-family:Jost,sans-serif;text-decoration:none;margin-top:10px;border:none;width:100%;cursor:pointer}

/* GENERIC PAGE HEADER */
.pg{padding:20px 15px 32px}
.pg-h{font-family:'Playfair Display',serif;font-size:26px;font-weight:700}
.pg-h em{font-style:italic;color:#999;font-size:.68em;display:block;font-family:Jost,sans-serif;text-transform:none;letter-spacing:0;margin-top:2px}
.pg-sub{font-size:13px;color:#666;margin:6px 0 16px}

/* TARIFS */
.tcard{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tcard-top{display:flex;justify-content:space-between;align-items:flex-start}
.tcard-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:600}
.tcard-sub{font-size:11px;color:#888;margin-top:3px}
.tcard-badge{background:var(--couleur-fonce);color:var(--couleur-fond);font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-left:8px}
.twa{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;border-radius:14px;padding:15px;text-decoration:none;font-weight:700;font-size:14px;font-family:Jost,sans-serif;margin-top:10px}

/* DEVIS FORM */
.lbl{font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--couleur-accent);margin:14px 0 7px}
.df-select,.df-textarea,.df-input{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid rgba(0,0,0,.14);background:#fff;font-size:14px;font-family:Jost,sans-serif;color:#1a1a1a;outline:none;-webkit-appearance:none}
.df-textarea{resize:none;height:80px}
.df-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;border-radius:15px;padding:16px;font-weight:700;font-size:15px;font-family:Jost,sans-serif;border:none;width:100%;cursor:pointer;margin-top:16px}
.devis-card{background:#f9f6ef;border:1.5px solid rgba(0,0,0,.12);border-radius:14px;padding:14px;width:100%;max-width:min(90%,340px)}
.devis-card-title{font-size:11px;font-weight:700;color:var(--couleur-fonce);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.1)}
.devis-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#1a1a1a;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.devis-line:last-child{border-bottom:none}
.devis-line-label{flex:1;color:#444}
.devis-line-price{font-weight:700;color:var(--couleur-fonce);margin-left:10px;white-space:nowrap}
.devis-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:2px solid rgba(0,0,0,.15)}
.devis-total-label{font-weight:700;font-size:14px}
.devis-total-price{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--couleur-accent)}
.devis-note{font-size:11px;font-style:italic;color:#888;margin-top:10px}

/* CATALOGUE */
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat-tab{padding:6px 14px;border-radius:20px;border:1.5px solid rgba(0,0,0,.12);background:#fff;font-size:12px;font-family:Jost,sans-serif;font-weight:500;cursor:pointer;color:#777}
.cat-tab.active{background:var(--couleur-fonce);color:var(--couleur-fond);border-color:var(--couleur-fonce)}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer}
.item-thumb{width:100%;aspect-ratio:1;background:var(--couleur-clair);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-info{padding:10px 12px 12px}
.item-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:600}
.item-price{font-size:12px;color:var(--couleur-accent);margin-top:2px;font-weight:600}
.pg-empty{grid-column:1/-1;text-align:center;padding:30px 10px;color:#999;font-size:13px}

/* GALERIE */
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal-item{border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.gal-avap{display:grid;grid-template-columns:1fr 1fr}
.gal-avap img{width:100%;aspect-ratio:1;object-fit:cover}
.gal-title{padding:8px 10px;font-size:12px;font-weight:600;background:#fff}

/* PLANNING */
.day-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.day-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1.5px solid rgba(0,0,0,.12);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer;color:#777;text-transform:uppercase}
.day-tab.active{background:var(--couleur-fonce);color:var(--couleur-fond);border-color:var(--couleur-fonce)}
.class-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:4px solid var(--couleur-alerte);cursor:pointer}
.class-time{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#999;text-transform:uppercase;margin-bottom:5px}
.class-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;margin-bottom:3px}
.class-meta{font-size:12.5px;color:#777}

/* RESERVATION */
.rz-row{display:flex;gap:10px}
.rz-row > div{flex:1}

/* OVERLAY */
#overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#overlay.open{display:flex}
#mbox{background:var(--couleur-fond);border-radius:24px 24px 0 0;padding:28px 20px 44px;width:100%;max-width:480px;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
.mbox-img{width:100%;max-height:60vw;border-radius:16px;object-fit:cover;margin:0 auto 16px;display:block;background:var(--couleur-clair)}
.mbox-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.mbox-desc{font-size:13px;color:#777;text-align:center;line-height:1.6;margin-bottom:8px}
.mbox-price{text-align:center;font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--couleur-accent);margin-bottom:18px}
.mbox-cancel{display:block;text-align:center;padding:12px;font-size:14px;color:#888;cursor:pointer;font-family:Jost,sans-serif;border:none;background:none;width:100%}

.moteur-badge{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:8px;color:rgba(0,0,0,.2);z-index:600;pointer-events:none}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-logo" id="sp-logo">⏳</div>
  <div class="sp-name" id="sp-name">Chargement...</div>
  <div class="sp-sub" id="sp-sub"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-av" id="tb-av">🔧</div>
    <div>
      <div class="tb-name" id="tb-name">...</div>
      <div class="tb-sub">Assistant IA · 24h/24</div>
    </div>
    <div class="tb-dot"></div>
  </div>

  <div id="tabs"></div>

  <div id="page-chat" class="page active">
    <div id="messages"></div>
    <div style="height:12px;flex-shrink:0"></div>
    <div id="composer">
      <div class="crow">
        <input id="inp" type="text" placeholder="Posez votre question..."/>
        <button id="snd" onclick="sendMsg()">&#10148;</button>
      </div>
    </div>
  </div>

  <div id="pages-dynamiques"></div>
</div>

<div id="overlay" onclick="fermerModal()">
  <div id="mbox" onclick="event.stopPropagation()">
    <div id="mbox-img-wrap"></div>
    <div class="mbox-name" id="mbox-name"></div>
    <div class="mbox-desc" id="mbox-desc"></div>
    <div class="mbox-price" id="mbox-price"></div>
    <a class="wa-bubble" id="mbox-wa" href="#" target="_blank">📱 Contacter sur WhatsApp</a>
    <button class="mbox-cancel" onclick="fermerModal()">Fermer</button>
  </div>
</div>

<div class="moteur-badge">Moteur générique multi-modules · Philomène IA</div>

<script>
var API = "https://philo-backend-by2c.onrender.com";
var CONFIG = null;
var busy = false;
var planningJourActif = null;
var catalogueFiltreActif = "tous";

function getSlugFromUrl() {
  var params = new URLSearchParams(window.location.search);
  return params.get("client") || "demo";
}

function definirIcone(elementId, cfg) {
  var el = document.getElementById(elementId);
  if (cfg.logoImage) { el.innerHTML = '<img src="' + cfg.logoImage + '" alt="logo"/>'; }
  else { el.textContent = cfg.icone; }
}

/* ===================== CHARGEMENT CONFIG ===================== */
function chargerConfig() {
  var slug = getSlugFromUrl();
  fetch(API + "/memory/config_" + slug)
    .then(function(r){ return r.json(); })
    .then(function(d){ appliquerConfig((d && d.value) ? d.value : CONFIG_PAR_DEFAUT); })
    .catch(function(){ appliquerConfig(CONFIG_PAR_DEFAUT); });
}

function appliquerConfig(cfg) {
  CONFIG = cfg;
  document.title = cfg.nom;
  document.getElementById("page-title").textContent = cfg.nom;

  var root = document.documentElement.style;
  root.setProperty("--couleur-fond", cfg.couleurs.fond);
  root.setProperty("--couleur-texte", cfg.couleurs.texte);
  root.setProperty("--couleur-fonce", cfg.couleurs.fonce);
  root.setProperty("--couleur-accent", cfg.couleurs.accent);
  root.setProperty("--couleur-clair", cfg.couleurs.clair || cfg.couleurs.fond);
  root.setProperty("--couleur-alerte", cfg.couleurs.alerte || cfg.couleurs.accent);

  definirIcone("sp-logo", cfg);
  document.getElementById("sp-name").textContent = cfg.nom.toUpperCase();
  document.getElementById("sp-sub").textContent = cfg.sousTitre;
  definirIcone("tb-av", cfg);
  document.getElementById("tb-name").textContent = cfg.nom;

  construireTabs(cfg);
  construirePagesDynamiques(cfg);

  setTimeout(function(){
    document.getElementById("splash").classList.add("gone");
    setTimeout(function(){
      document.getElementById("splash").style.display = "none";
      addBot(cfg.messageAccueil, true);
    }, 900);
  }, 1600);
}

var MODULE_LABELS = {
  tarifs: { icone: "💰", nom: "Tarifs" },
  devis: { icone: "📋", nom: "Devis" },
  catalogue: { icone: "🛍️", nom: "Catalogue" },
  galerie: { icone: "🖼️", nom: "Galerie" },
  planning: { icone: "🗓️", nom: "Planning" },
  reservation: { icone: "📅", nom: "Réserver" }
};

function construireTabs(cfg) {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = '<button class="tab active" onclick="showTab(this,\'chat\')"><span>💬</span>Assistant</button>';
  (cfg.modulesActifs || []).forEach(function(mod){
    var info = MODULE_LABELS[mod];
    if (!info) return;
    var b = document.createElement("button");
    b.className = "tab";
    b.innerHTML = '<span>' + info.icone + '</span>' + info.nom;
    b.onclick = function(){ showTab(b, mod); };
    tabs.appendChild(b);
  });
}

function showTab(btn, n) {
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-" + n).classList.add("active");
  btn.classList.add("active");
}

function ouvrirTabParNom(nomModule) {
  var tabs = document.querySelectorAll(".tab");
  for (var i=0;i<tabs.length;i++){
    if (tabs[i].textContent.trim().toLowerCase().indexOf(MODULE_LABELS[nomModule].nom.toLowerCase()) >= 0) {
      showTab(tabs[i], nomModule);
      return;
    }
  }
}

/* ===================== CONSTRUCTION DES PAGES ===================== */
function construirePagesDynamiques(cfg) {
  var container = document.getElementById("pages-dynamiques");
  container.innerHTML = "";
  (cfg.modulesActifs || []).forEach(function(mod){
    var div = document.createElement("div");
    div.className = "page";
    div.id = "page-" + mod;
    container.appendChild(div);
    if (mod === "tarifs") construireTarifs(div, cfg);
    if (mod === "devis") construireDevis(div, cfg);
    if (mod === "catalogue") construireCatalogue(div, cfg);
    if (mod === "galerie") construireGalerie(div, cfg);
    if (mod === "planning") construirePlanning(div, cfg);
    if (mod === "reservation") construireReservation(div, cfg);
  });
}

/* ---------- TARIFS ---------- */
function construireTarifs(div, cfg) {
  var html = '<div class="pg"><div class="pg-h">Tarifs<em>' + (cfg.tarifsSousTitre || "Indicatifs") + '</em></div>';
  (cfg.tarifs || []).forEach(function(t){
    html += '<div class="tcard"><div class="tcard-top"><div><div class="tcard-name">' + t.nom + '</div><div class="tcard-sub">' + t.description + '</div></div><div class="tcard-badge">' + t.prix + '</div></div></div>';
  });
  html += '<a class="twa" href="https://wa.me/' + cfg.telephoneWhatsApp + '?text=' + encodeURIComponent("Bonjour " + cfg.nom + " !") + '" target="_blank">📱 Demander un devis</a></div>';
  div.innerHTML = html;
}

/* ---------- DEVIS ---------- */
function construireDevis(div, cfg) {
  var options = (cfg.devisTypes || ["Autre"]).map(function(t){ return '<option>' + t + '</option>'; }).join('');
  div.innerHTML =
    '<div class="pg">' +
    '<div class="pg-h">Devis gratuit<em>Décrivez votre projet</em></div>' +
    '<div class="lbl">Type de prestation</div>' +
    '<select class="df-select" id="dv-type"><option value="">Sélectionnez...</option>' + options + '</select>' +
    '<div class="lbl">Description</div>' +
    '<textarea class="df-textarea" id="dv-desc" placeholder="Décrivez votre besoin..."></textarea>' +
    '<div class="lbl">Surface / quantité</div>' +
    '<input class="df-input" id="dv-surface" placeholder="Ex: 25m², 3 pièces..."/>' +
    '<button class="df-btn" onclick="genererDevisForm()">✨ Générer mon devis</button>' +
    '</div>';
}

function genererDevisForm() {
  var type = document.getElementById("dv-type").value;
  var desc = document.getElementById("dv-desc").value.trim();
  var surface = document.getElementById("dv-surface").value.trim();
  if (!type) { alert("Merci de sélectionner un type de prestation."); return; }

  var resume = "Devis pour : " + type + (desc ? " — " + desc : "") + (surface ? " — " + surface : "");
  ouvrirTabParNom("chat") /* no-op safeguard */;
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-chat").classList.add("active");
  document.querySelectorAll(".tab")[0].classList.add("active");

  addUser(resume);
  setTyping(true);

  var messageIA = "Génère un devis pour cette demande :\nType : " + type + "\n" + (desc ? "Description : " + desc + "\n" : "") + (surface ? "Surface/quantité : " + surface : "");
  var promptDevis = CONFIG.devisPrompt || CONFIG.systemPrompt;

  fetch(API + "/vitrine", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: messageIA, userId: getSlugFromUrl() + "_devis_" + Date.now(), systemPrompt: promptDevis })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    setTyping(false);
    try {
      var raw = (d && d.answer) ? d.answer : "{}";
      var clean = raw.replace(/```json/g,"").replace(/```/g,"").trim();
      renderDevisCard(JSON.parse(clean));
    } catch(e) {
      addBot("Je n'ai pas réussi à générer le devis, réessayez avec une description plus précise.");
    }
  }).catch(function(){
    setTyping(false);
    addBot("Erreur de connexion, réessayez.");
  });
}

function renderDevisCard(data) {
  var msgs = document.getElementById("messages");
  var row = document.createElement("div");
  row.className = "mrow bot";
  var card = document.createElement("div");
  card.className = "devis-card";
  card.innerHTML = '<div class="devis-card-title">' + CONFIG.icone + ' ' + (data.titre || "DEVIS ESTIMATIF") + '</div>';
  (data.lignes || []).forEach(function(l){
    card.innerHTML += '<div class="devis-line"><div class="devis-line-label">' + l.label + (l.detail ? " — " + l.detail : "") + '</div><div class="devis-line-price">' + l.prix + '</div></div>';
  });
  card.innerHTML += '<div class="devis-total"><div class="devis-total-label">' + (data.duree ? "Total estimé (" + data.duree + ")" : "Total estimé") + '</div><div class="devis-total-price">' + (data.total || "Sur devis") + '</div></div>';
  card.innerHTML += '<div class="devis-note">Devis estimatif — à confirmer.</div>';
  var waBtn = document.createElement("button");
  waBtn.className = "wa-bubble";
  var waMsg = "Bonjour " + CONFIG.nom + " ! J'ai reçu ce devis estimatif : " + (data.titre || "") + ", total " + (data.total || "") + ". Je voudrais confirmer.";
  waBtn.onclick = function(){ window.open("https://wa.me/" + CONFIG.telephoneWhatsApp + "?text=" + encodeURIComponent(waMsg), "_blank"); };
  waBtn.textContent = "✅ Confirmer sur WhatsApp";
  card.appendChild(waBtn);
  row.appendChild(mkAv());
  row.appendChild(card);
  msgs.appendChild(row);
  scrollChat();
}

/* ---------- CATALOGUE ---------- */
function construireCatalogue(div, cfg) {
  var items = cfg.catalogue || [];
  var cats = ["tous"];
  items.forEach(function(it){ if (it.categorie && cats.indexOf(it.categorie) === -1) cats.push(it.categorie); });
  var html = '<div class="pg"><div class="pg-h">' + (cfg.catalogueTitre || "Notre sélection") + '<em>' + (cfg.catalogueSousTitre || "") + '</em></div>';
  if (cats.length > 1) {
    html += '<div class="cat-tabs" id="cat-tabs">';
    cats.forEach(function(c,i){ html += '<button class="cat-tab' + (i===0?' active':'') + '" onclick="filtrerCatalogue(this,\'' + c + '\')">' + (c==="tous"?"Tout":c) + '</button>'; });
    html += '</div>';
  }
  html += '<div class="item-grid" id="catalogue-grid"></div></div>';
  div.innerHTML = html;
  renderCatalogueGrid(items, "tous");
}

function filtrerCatalogue(btn, cat) {
  catalogueFiltreActif = cat;
  document.querySelectorAll("#cat-tabs .cat-tab").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  renderCatalogueGrid(CONFIG.catalogue || [], cat);
}

function renderCatalogueGrid(items, filtre) {
  var grid = document.getElementById("catalogue-grid");
  var liste = filtre === "tous" ? items : items.filter(function(it){ return it.categorie === filtre; });
  if (!liste.length) { grid.innerHTML = '<div class="pg-empty">Rien à afficher pour le moment.</div>'; return; }
  grid.innerHTML = "";
  liste.forEach(function(it){
    var card = document.createElement("div");
    card.className = "item-card";
    card.onclick = function(){ ouvrirItem(it); };
    card.innerHTML = '<div class="item-thumb">' + (it.image ? '<img src="'+it.image+'">' : (CONFIG.icone||'📦')) + '</div><div class="item-info"><div class="item-name">' + it.nom + '</div><div class="item-price">' + it.prix + '</div></div>';
    grid.appendChild(card);
  });
}

function ouvrirItem(it) {
  document.getElementById("mbox-img-wrap").innerHTML = it.image ? '<img class="mbox-img" src="' + it.image + '">' : '';
  document.getElementById("mbox-name").textContent = it.nom;
  document.getElementById("mbox-desc").textContent = it.description || "";
  document.getElementById("mbox-price").textContent = it.prix;
  var msg = "Bonjour " + CONFIG.nom + " ! Je suis intéressé(e) par : " + it.nom + " (" + it.prix + ").";
  document.getElementById("mbox-wa").href = "https://wa.me/" + CONFIG.telephoneWhatsApp + "?text=" + encodeURIComponent(msg);
  document.getElementById("overlay").classList.add("open");
}
function fermerModal() { document.getElementById("overlay").classList.remove("open"); }

/* ---------- GALERIE ---------- */
function construireGalerie(div, cfg) {
  var items = cfg.galerie || [];
  var html = '<div class="pg"><div class="pg-h">' + (cfg.galerieTitre || "Nos réalisations") + '<em>Avant / Après</em></div><div class="gal-grid">';
  if (!items.length) html += '<div class="pg-empty">Les photos arrivent bientôt !</div>';
  items.forEach(function(c){
    html += '<div class="gal-item"><div class="gal-avap">' + (c.avant?'<img src="'+c.avant+'">':'') + (c.apres?'<img src="'+c.apres+'">':'') + '</div><div class="gal-title">' + (c.titre||"") + '</div></div>';
  });
  html += '</div></div>';
  div.innerHTML = html;
}

/* ---------- PLANNING ---------- */
function construirePlanning(div, cfg) {
  var planning = cfg.planning || {};
  var jours = Object.keys(planning);
  var html = '<div class="pg"><div class="pg-h">Planning<em>Nos créneaux</em></div><div class="day-tabs" id="day-tabs">';
  jours.forEach(function(j,i){ html += '<button class="day-tab' + (i===0?' active':'') + '" onclick="afficherJour(this,\'' + j + '\')">' + j + '</button>'; });
  html += '</div><div id="planning-contenu"></div></div>';
  div.innerHTML = html;
  if (jours.length) afficherJourContenu(jours[0]);
}

function afficherJour(btn, jour) {
  document.querySelectorAll("#day-tabs .day-tab").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  afficherJourContenu(jour);
}

function afficherJourContenu(jour) {
  var cours = (CONFIG.planning || {})[jour] || [];
  var el = document.getElementById("planning-contenu");
  if (!cours.length) { el.innerHTML = '<div class="pg-empty">Rien de prévu ce jour-là.</div>'; return; }
  el.innerHTML = "";
  cours.forEach(function(c){
    var card = document.createElement("div");
    card.className = "class-card";
    card.onclick = function(){
      var msg = "Bonjour " + CONFIG.nom + " ! Je voudrais réserver : " + c.nom + " (" + c.heure + ").";
      window.open("https://wa.me/" + CONFIG.telephoneWhatsApp + "?text=" + encodeURIComponent(msg), "_blank");
    };
    card.innerHTML = '<div class="class-time">' + c.heure + '</div><div class="class-name">' + c.nom + '</div><div class="class-meta">' + (c.meta||"") + '</div>';
    el.appendChild(card);
  });
}

/* ---------- RESERVATION ---------- */
function construireReservation(div, cfg) {
  var options = (cfg.reservationServices || []).map(function(s){ return '<option>' + s.nom + (s.prix ? ' — '+s.prix : '') + '</option>'; }).join('');
  div.innerHTML =
    '<div class="pg">' +
    '<div class="pg-h">Réserver<em>Rapide et sans engagement</em></div>' +
    '<div class="lbl">Service souhaité</div>' +
    '<select class="df-select" id="rz-service"><option value="">Choisissez...</option>' + options + '</select>' +
    '<div class="rz-row"><div><div class="lbl">Date</div><input class="df-input" id="rz-date" type="date"/></div>' +
    '<div><div class="lbl">Heure</div><input class="df-input" id="rz-heure" type="time"/></div></div>' +
    '<div class="lbl">Note (optionnel)</div>' +
    '<input class="df-input" id="rz-note" placeholder="Précisions utiles..."/>' +
    '<button class="df-btn" onclick="envoyerReservation()">📱 Envoyer la demande</button>' +
    '</div>';
}

function envoyerReservation() {
  var service = document.getElementById("rz-service").value;
  var date = document.getElementById("rz-date").value;
  var heure = document.getElementById("rz-heure").value;
  var note = document.getElementById("rz-note").value.trim();
  if (!service || !date) { alert("Merci de choisir un service et une date."); return; }
  var msg = "Bonjour " + CONFIG.nom + " ! Je voudrais réserver :\n\nService : " + service + "\nDate : " + date + (heure ? "\nHeure : " + heure : "") + (note ? "\nNote : " + note : "");
  window.open("https://wa.me/" + CONFIG.telephoneWhatsApp + "?text=" + encodeURIComponent(msg), "_blank");
}

/* ===================== CHAT ===================== */
function scrollChat() {
  setTimeout(function(){ var c = document.getElementById("page-chat"); c.scrollTop = c.scrollHeight; }, 80);
}
function mkAv() {
  var av = document.createElement("div");
  av.className = "bav";
  if (CONFIG.logoImage) av.innerHTML = '<img src="' + CONFIG.logoImage + '" alt="logo"/>';
  else av.textContent = CONFIG.icone;
  return av;
}
function addBot(txt, withQ) {
  var msgs = document.getElementById("messages");
  var row = document.createElement("div");
  row.className = "mrow bot";
  var bub = document.createElement("div");
  bub.className = "bub bot";
  bub.textContent = txt;
  if (withQ && CONFIG.questionsRapides && CONFIG.questionsRapides.length) {
    var qw = document.createElement("div");
    qw.className = "qbtns";
    CONFIG.questionsRapides.forEach(function(it){
      var b = document.createElement("button");
      b.className = "qb";
      b.textContent = it.label;
      b.onclick = function(){ send(it.message); };
      qw.appendChild(b);
    });
    bub.appendChild(qw);
  }
  row.appendChild(mkAv());
  row.appendChild(bub);
  msgs.appendChild(row);
  scrollChat();
}
function addUser(txt) {
  var msgs = document.getElementById("messages");
  var row = document.createElement("div");
  row.className = "mrow user";
  var bub = document.createElement("div");
  bub.className = "bub user";
  bub.textContent = txt;
  row.appendChild(bub);
  msgs.appendChild(row);
  scrollChat();
}
function setTyping(on) {
  var old = document.getElementById("ty-row");
  if (old) old.remove();
  if (!on) return;
  var msgs = document.getElementById("messages");
  var row = document.createElement("div");
  row.className = "mrow bot";
  row.id = "ty-row";
  var ty = document.createElement("div");
  ty.className = "tybub";
  ty.innerHTML = "<span></span><span></span><span></span>";
  row.appendChild(mkAv());
  row.appendChild(ty);
  msgs.appendChild(row);
  scrollChat();
}
function send(txt) {
  if (!txt || busy) return;
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-chat").classList.add("active");
  document.querySelectorAll(".tab")[0].classList.add("active");
  addUser(txt);
  busy = true;
  setTyping(true);
  fetch(API + "/vitrine", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: txt, userId: getSlugFromUrl() + "_" + Date.now(), systemPrompt: CONFIG.systemPrompt })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    setTyping(false);
    addBot((d && d.answer) ? d.answer : "Je suis là pour vous aider !");
    busy = false;
  }).catch(function(){
    setTyping(false);
    addBot("Erreur de connexion, réessayez.");
    busy = false;
  });
}
function sendMsg() {
  var inp = document.getElementById("inp");
  var txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  send(txt);
}
document.getElementById("inp").addEventListener("keydown", function(e){ if (e.key === "Enter") sendMsg(); });
