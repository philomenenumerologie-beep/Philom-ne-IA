<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Créateur d'appli — Philomène IA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Jost,sans-serif}
body{background:#1a2e20;color:#f2ead8;padding:20px 16px 60px;max-width:540px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px}
.sub{font-size:12px;color:rgba(242,234,216,.5);margin-bottom:20px}
.card{background:rgba(242,234,216,.06);border:1px solid rgba(242,234,216,.12);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:rgba(242,234,216,.6);margin-bottom:12px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(242,234,216,.4);margin-bottom:5px;display:block}
input,textarea,select{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid rgba(242,234,216,.15);background:rgba(242,234,216,.06);color:#f2ead8;font-size:14px;margin-bottom:12px;outline:none;-webkit-appearance:none}
select option{background:#1a2e20;color:#f2ead8}
textarea{resize:vertical;min-height:56px}

/* PALETTE DE BULLES DE COULEUR */
.palette-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.palette-bulle{width:42px;height:42px;border-radius:50%;cursor:pointer;border:2px solid rgba(242,234,216,.2);position:relative;flex-shrink:0}
.palette-bulle.selected{border-color:#f2ead8;box-shadow:0 0 0 2px rgba(242,234,216,.3)}
.palette-bulle span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap;color:rgba(242,234,216,.4)}

.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=color]{padding:2px;height:38px}

.modules-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.mod-check{display:flex;align-items:center;gap:8px;background:rgba(242,234,216,.05);border:1.5px solid rgba(242,234,216,.12);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px}
.mod-check input{width:16px;height:16px;margin:0;flex-shrink:0}
.mod-check.active{border-color:#6BCB77;background:rgba(107,203,119,.08)}

.item-row{display:grid;grid-template-columns:1fr 1fr 0.7fr auto;gap:6px;margin-bottom:8px;align-items:center}
.del-btn{background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.3);color:#ff8a7a;border-radius:8px;font-size:14px;cursor:pointer;padding:8px}
.add-btn{background:none;border:1.5px dashed rgba(242,234,216,.25);color:rgba(242,234,216,.6);border-radius:8px;padding:9px;width:100%;cursor:pointer;font-size:12px;margin-top:2px}
.save-btn{width:100%;padding:15px;border-radius:12px;border:none;background:#f2ead8;color:#1a2e20;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.status{font-size:12px;padding:10px;border-radius:8px;margin-top:10px;display:none}
.status.ok{background:rgba(46,204,113,.15);color:#6BCB77;display:block}
.status.err{background:rgba(255,107,107,.1);color:#ff8a7a;display:block}
.logo-zone{border:2px dashed rgba(242,234,216,.25);border-radius:10px;padding:16px;text-align:center;cursor:pointer;margin-bottom:12px}
.logo-zone p{font-size:12px;color:rgba(242,234,216,.4)}
.logo-zone img{max-width:90px;max-height:60px;border-radius:8px;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto}
.subsection{display:none;border-top:1px solid rgba(242,234,216,.1);padding-top:12px;margin-top:12px}
.subsection.show{display:block}
.day-block{background:rgba(242,234,216,.04);border-radius:10px;padding:10px;margin-bottom:8px}
.day-block h3{font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)}
</style>
</head>
<body>

<h1>🛠️ Créateur d'appli</h1>
<div class="sub">Choisis un métier, tout se pré-remplit. Ajuste, complète, enregistre.</div>

<div class="card">
  <h2>1. Métier</h2>
  <label class="lbl">Secteur d'activité</label>
  <select id="cf-secteur"></select>
  <label class="lbl">Slug (utilisé dans l'URL ?client=...)</label>
  <input id="cf-slug" placeholder="Ex: renovnord"/>
</div>

<div class="card">
  <h2>2. Identité</h2>
  <label class="lbl">Nom de l'entreprise</label>
  <input id="cf-nom" placeholder="Ex: Rénov Nord"/>
  <label class="lbl">Sous-titre</label>
  <input id="cf-soustitre" placeholder="Ex: Rénovation intérieure"/>
  <label class="lbl">Logo / photo (remplace l'icône si ajouté)</label>
  <div class="logo-zone" id="logo-zone" onclick="document.getElementById('logo-input').click()">
    <img id="logo-preview" style="display:none"/>
    <p id="logo-txt">Appuyez pour ajouter un logo (facultatif)</p>
  </div>
  <input type="file" id="logo-input" accept="image/*" style="display:none" onchange="handleLogo(this)"/>
  <label class="lbl">Icône de secours (emoji)</label>
  <input id="cf-icone" placeholder="🏠"/>
  <label class="lbl">Numéro WhatsApp (international, sans +)</label>
  <input id="cf-whatsapp" placeholder="33612345678"/>
</div>

<div class="card">
  <h2>3. Couleurs</h2>
  <label class="lbl">Palettes suggérées (clique pour appliquer)</label>
  <div class="palette-grid" id="palette-grid"></div>
  <label class="lbl" style="margin-top:6px">Ajustement fin</label>
  <div class="row3">
    <div><label class="lbl">Fond</label><input type="color" id="cf-fond"/></div>
    <div><label class="lbl">Texte</label><input type="color" id="cf-texte"/></div>
    <div><label class="lbl">Foncé</label><input type="color" id="cf-fonce"/></div>
  </div>
  <div class="row3">
    <div><label class="lbl">Accent</label><input type="color" id="cf-accent"/></div>
    <div><label class="lbl">Clair</label><input type="color" id="cf-clair"/></div>
    <div><label class="lbl">Alerte</label><input type="color" id="cf-alerte"/></div>
  </div>
</div>

<div class="card">
  <h2>4. Assistant IA</h2>
  <label class="lbl">Message d'accueil</label>
  <textarea id="cf-accueil"></textarea>
  <label class="lbl">Consigne pour l'IA (ce qu'elle sait, comment elle répond)</label>
  <textarea id="cf-prompt" style="min-height:100px"></textarea>
  <label class="lbl">Questions rapides (boutons sous le 1er message)</label>
  <div id="qr-list"></div>
  <button class="add-btn" onclick="ajouterQR()">+ Ajouter une question rapide</button>
</div>

<div class="card">
  <h2>5. Modules à activer</h2>
  <div class="modules-grid" id="modules-grid"></div>

  <div class="subsection" id="sub-tarifs">
    <h3 style="font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)">💰 Tarifs</h3>
    <label class="lbl">Sous-titre</label>
    <input id="cf-tarifs-soustitre" placeholder="Ex: Prix indicatifs"/>
    <div id="tarifs-list"></div>
    <button class="add-btn" onclick="ajouterTarif()">+ Ajouter un tarif</button>
  </div>

  <div class="subsection" id="sub-devis">
    <h3 style="font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)">📋 Devis</h3>
    <label class="lbl">Types de prestations proposées (une par ligne)</label>
    <textarea id="cf-devis-types" placeholder="Peinture intérieure&#10;Revêtement de sol&#10;..." style="min-height:80px"></textarea>
    <label class="lbl">Consigne IA spécifique au devis (prix, règles de calcul)</label>
    <textarea id="cf-devis-prompt" style="min-height:80px"></textarea>
  </div>

  <div class="subsection" id="sub-catalogue">
    <h3 style="font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)">🛍️ Catalogue</h3>
    <label class="lbl">Titre de la page</label>
    <input id="cf-catalogue-titre" placeholder="Ex: Notre carte"/>
    <label class="lbl">Sous-titre</label>
    <input id="cf-catalogue-soustitre" placeholder="Ex: Fait maison"/>
    <div id="catalogue-list"></div>
    <button class="add-btn" onclick="ajouterCatalogueItem()">+ Ajouter un article</button>
  </div>

  <div class="subsection" id="sub-galerie">
    <h3 style="font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)">🖼️ Galerie</h3>
    <label class="lbl">Titre de la page</label>
    <input id="cf-galerie-titre" placeholder="Ex: Nos réalisations"/>
    <div id="galerie-list"></div>
    <button class="add-btn" onclick="ajouterGalerieItem()">+ Ajouter un avant/après</button>
  </div>

  <div class="subsection" id="sub-planning">
    <h3 style="font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)">🗓️ Planning</h3>
    <div id="planning-jours"></div>
  </div>

  <div class="subsection" id="sub-reservation">
    <h3 style="font-size:12px;margin-bottom:8px;color:rgba(242,234,216,.7)">📅 Réservation</h3>
    <label class="lbl">Services proposés</label>
    <div id="reservation-list"></div>
    <button class="add-btn" onclick="ajouterReservationService()">+ Ajouter un service</button>
  </div>
</div>

<button class="save-btn" onclick="enregistrer()">💾 Enregistrer et créer le lien</button>
<div class="status" id="status"></div>

  var label = document.createElement("label");
  label.className = "mod-check";
  label.innerHTML = '<input type="checkbox" value="' + key + '" onchange="toggleSubsection(\'' + key + '\', this.checked); this.parentElement.classList.toggle(\'active\', this.checked)"/>' + MODULES_DISPO[key];

});

function toggleSubsection(mod, show) {
  var el = document.getElementById("sub-" + mod);
  if (el) el.classList.toggle("show", show);
}

secteurSelect.addEventListener("change", function(){
  var s = SECTEURS[secteurSelect.value];
  if (!s) return;
  document.getElementById("cf-icone").value = s.icone;
  document.getElementById("cf-soustitre").value = s.sousTitre;
  document.getElementById("cf-accueil").value = s.accueil;
  document.getElementById("cf-prompt").value = s.prompt;

  var palette = PALETTES.filter(function(p){ return p.nom === s.palette; })[0];
  if (palette) appliquerPalette(palette);

  document.getElementById("qr-list").innerHTML = "";
  (s.questions || []).forEach(function(q){ ajouterQR(q.label, q.message); });

  document.querySelectorAll(".mod-check input").forEach(function(cb){
    var actif = (s.modules || []).indexOf(cb.value) >= 0;
    cb.checked = actif;
    cb.parentElement.classList.toggle("active", actif);
    toggleSubsection(cb.value, actif);
  });

  document.getElementById("cf-tarifs-soustitre").value = "Prix indicatifs";
  document.getElementById("tarifs-list").innerHTML = "";
  (s.tarifs || []).forEach(function(t){ ajouterTarif(t.nom, t.description, t.prix); });

  document.getElementById("cf-devis-types").value = (s.devisTypes || []).join("\n");
  document.getElementById("cf-devis-prompt").value = s.devisPrompt || "";

});

/* ---------- PHOTOS (logo + items) ---------- */
function compressPhoto(file, maxSize, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
      else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleLogo(input) {
  var f = input.files[0];
  if (!f) return;
  compressPhoto(f, 400, function(b64){
    logoBase64 = b64;
    var prev = document.getElementById('logo-preview');
    prev.src = b64; prev.style.display = 'block';
    document.getElementById('logo-txt').textContent = 'Toucher pour changer';
  });
}
function handleItemPhoto(input, uid) {
  var f = input.files[0];
  if (!f) return;
  compressPhoto(f, 700, function(b64){
    var prev = document.getElementById('prev-' + uid);
    prev.src = b64; prev.style.display = 'block';
    prev.setAttribute('data-img', b64);
  });
}

/* =====================================================================
   ENREGISTREMENT
   ===================================================================== */
function enregistrer() {
  var slug = document.getElementById("cf-slug").value.trim();
  if (!slug) { showStatus("Renseigne un slug avant d'enregistrer.", "err"); return; }

  var modulesActifs = [];
  document.querySelectorAll(".mod-check input:checked").forEach(function(cb){ modulesActifs.push(cb.value); });

  var qr = [];
  document.querySelectorAll("#qr-list .item-row").forEach(function(row){
    var inputs = row.querySelectorAll("input");
    if (inputs[0].value.trim()) qr.push({ label: inputs[0].value.trim(), message: inputs[1].value.trim() });
  });

  var tarifs = [];
  document.querySelectorAll("#tarifs-list .item-row").forEach(function(row){
    var inputs = row.querySelectorAll("input");
    if (inputs[0].value.trim()) tarifs.push({ nom: inputs[0].value.trim(), description: inputs[1].value.trim(), prix: inputs[2].value.trim() });
  });

  var catalogue = [];
  document.querySelectorAll("#catalogue-list .day-block").forEach(function(row){
    var nom = row.querySelector(".ci-nom").value.trim();
    if (!nom) return;
    var img = row.querySelector("img");
    catalogue.push({
      nom: nom,
      categorie: row.querySelector(".ci-cat").value.trim(),
      prix: row.querySelector(".ci-prix").value.trim(),
      image: img ? img.getAttribute("data-img") : ""
    });
  });

  var galerie = [];
  document.querySelectorAll("#galerie-list .day-block").forEach(function(row){
    var titre = row.querySelector(".gi-titre").value.trim();
    var imgs = row.querySelectorAll("img");
    if (!titre && !imgs[0].getAttribute("data-img") && !imgs[1].getAttribute("data-img")) return;
    galerie.push({ titre: titre, avant: imgs[0].getAttribute("data-img"), apres: imgs[1].getAttribute("data-img") });
  });

  var reservationServices = [];
  document.querySelectorAll("#reservation-list .item-row").forEach(function(row){
    var inputs = row.querySelectorAll("input");
    if (inputs[0].value.trim()) reservationServices.push({ nom: inputs[0].value.trim(), prix: inputs[1].value.trim() });
  });

  var planning = {};
  JOURS_SEMAINE.forEach(function(jour){
    var container = document.querySelector('.pj-cours[data-jour="' + jour + '"]');
    var cours = [];
    container.querySelectorAll(".item-row").forEach(function(row){
      var inputs = row.querySelectorAll("input");
      if (inputs[1].value.trim()) cours.push({ heure: inputs[0].value.trim(), nom: inputs[1].value.trim(), meta: inputs[2].value.trim() });
    });
    if (cours.length) planning[jour] = cours;
  });

  var config = {
    secteur: document.getElementById("cf-secteur").value,
    nom: document.getElementById("cf-nom").value.trim(),
    sousTitre: document.getElementById("cf-soustitre").value.trim(),
    icone: document.getElementById("cf-icone").value.trim() || "🔧",
    logoImage: logoBase64 || "",
    telephoneWhatsApp: document.getElementById("cf-whatsapp").value.trim(),
    couleurs: {
      fond: document.getElementById("cf-fond").value,
      texte: document.getElementById("cf-texte").value,
      fonce: document.getElementById("cf-fonce").value,
      accent: document.getElementById("cf-accent").value,
      clair: document.getElementById("cf-clair").value,
      alerte: document.getElementById("cf-alerte").value
    },
    messageAccueil: document.getElementById("cf-accueil").value.trim(),
    systemPrompt: document.getElementById("cf-prompt").value.trim(),
    questionsRapides: qr,
    modulesActifs: modulesActifs,
    tarifsSousTitre: document.getElementById("cf-tarifs-soustitre").value.trim(),
    tarifs: tarifs,
    devisTypes: document.getElementById("cf-devis-types").value.split("\n").map(function(s){return s.trim();}).filter(Boolean),
    devisPrompt: document.getElementById("cf-devis-prompt").value.trim(),
    catalogueTitre: document.getElementById("cf-catalogue-titre").value.trim(),
    catalogueSousTitre: document.getElementById("cf-catalogue-soustitre").value.trim(),
    catalogue: catalogue,
    galerieTitre: document.getElementById("cf-galerie-titre").value.trim(),
    galerie: galerie,
    reservationServices: reservationServices,
    planning: planning
  };

  fetch(API + "/memory/config_" + slug, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value: config })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    if (d && d.ok) {
      showStatus("✅ Enregistré ! Lien à donner au client : moteur-v2.html?client=" + slug, "ok");
    } else {
      showStatus("Erreur lors de l'enregistrement.", "err");
    }
  }).catch(function(){
    showStatus("Erreur de connexion.", "err");
  });
}

function showStatus(msg, type) {
  var s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + type;
}
